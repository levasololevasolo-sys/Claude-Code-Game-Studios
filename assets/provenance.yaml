# Provenance of every shipped asset (art bible §8): source, licence, author, date, AI.
- path: assets/art/hero/char_hero_*_01.svg
  source: generated by tools/asset-pipeline/hero/build_hero.py (hand-authored vector shapes)
  licence: project-owned (original work)
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes (shapes authored as code by an AI agent; no image model, no third-party art)
  note: look tiers 1 «Павший», 2 «Странник», 3 «Ополченец», 4 «Витязь», 5 «Богатырь» (tiers 2-4 added 2026-11-27; parts unchanged between tiers fall back to the nearest lower tier).
- path: assets/audio/sfx/*.wav
  source: synthesised by tools/asset-pipeline/audio/build_sfx.py (Python standard library; filtered noise, swept sines, fixed seeds; no samples, no third-party sound)
  licence: project-owned, generated in-house (CC0-equivalent; no third-party rights)
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes (synthesis code authored by an AI agent; no audio model, no sample libraries)
  note: 23 files (swing_1-3, hit_flesh_1-3, hit_heavy, wall_slam, pogo, roll, dash, jump, land, hero_hurt, enemy_death, amulet_tick, flare, rune_chime, door_open, ember_pickup, boss_roar, ui_move, ui_confirm); mono 44.1 kHz 16-bit, -1 dBFS peak. Rebuild is byte-identical.
- path: default_bus_layout.tres
  source: hand-written bus layout (Master, SFX, Music, UI)
  licence: project-owned (original work)
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes
- path: assets/art/icons/ui_icon_{god,rune,door}_*.svg
  source: generated by tools/asset-pipeline/icons/build_icons.py (hand-authored vector shapes, standard-library Python)
  licence: project-owned (original work)
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes (shapes authored as code by an AI agent; no image model, no third-party art)
  note: 6 god signs (folk shapes, no hooked/swastika-like forms), one icon per rune of runes.json, door reward icons of doors.json. Re-run the script after adding a rune, god or door type.
- path: assets/art/sprites/{hero,crawler,swamp}/*.png, assets/art/sprites/*/*_sheets.json
  source: rendered by tools/asset-pipeline/blender/{build_hero,build_crawler,build_swamp_bg}.py (Blender 4.0.2 EEVEE, headless) and packed by pack_sheets.py; models built from primitives by script, animated by script
  licence: project-owned (original work); no third-party models, textures, HDRIs or animations
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes (geometry, rigs, poses and shaders authored as code by an AI agent; no image model)
  note: art slice (design/art/visual-upgrade-plan.md). Hero tier 1, Трясинник, Топь backdrop (3 parallax layers, ground strip, log platform). Each sheet has a _n.png normal map (OpenGL convention). Blender is GPL; its rendered output is not covered by the GPL.
- path: assets/art/sprites/{forest,frost,base}/bg_{far,mid,near}.webp
  source: rendered by tools/asset-pipeline/blender/build_location_bg.py <place> (Blender 4.0.2 EEVEE, headless), converted by to_webp.py (lossy WebP q90); models built from primitives by script
  licence: project-owned (original work); no third-party models, textures or HDRIs
  author: technical-artist agent (Claude), for the developer
  date: 2026-11-27
  ai_made: yes (geometry and shaders authored as code by an AI agent; no image model)
  note: Тёмный бор, Царство Морены and Застава parallax backdrops (3 tiling layers each, 2560/3200/3840 x 1080, 0.84 MB total). Used through visuals.json tex slots.
- path: tools/asset-pipeline/blender/data/hero_base.json.gz (and the hero body in assets/art/sprites/hero/*.png from 2026-11-27, v2)
  source: derived by tools/asset-pipeline/blender/mh_base.py from the MakeHuman hm08 base mesh (makehuman/data/3dobjs/base.obj), macro targets (caucasian-male-young, universal-male-young-maxmuscle-minweight, male-young-maxmuscle-averageweight-maxheight), default skeleton and skin weights (rigs/default.mhskel, default_weights.mhw) of https://github.com/makehumancommunity/makehuman at commit a8bc2d54ff0ac92e78ff71431b1023eda42bf482
  licence: CC0 1.0 Universal (LICENSE.ASSETS.md of that repo; every used file's header and the mhskel/mhw "license" field say CC0, released September 2020; copyright holders at release Data Collection AB, Joel Palmius, Jonas Hauquier; targets originally Manuel Bastioni 2014, transferred). No attribution required; credited here anyway.
  author: MakeHuman team (base data); re-posed, stylised, re-rigged, clothed and textured by the technical-artist agent (Claude) for the developer
  date: 2026-11-27
  ai_made: partly (third-party CC0 human base mesh; everything built on it - pose, proportions, clothes, hair, beard, props, procedural painted materials, animation - authored as code by an AI agent; no image model)
  note: the MakeHuman repository itself is not shipped or committed; fetch_makehuman.sh re-fetches the exact files. MakeHuman's code is AGPL but no code of it is used, only CC0 data.
