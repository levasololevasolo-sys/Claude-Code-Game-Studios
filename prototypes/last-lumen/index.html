<script>
'use strict';
// Last Lumen: a side-view action roguelite. A moth-winged lantern knight descends a drowned
// clockwork city. Hits charge the lantern (which is also the light you see by); a full lantern
// is spent on a Flare. Boons after each room reshape strike, dash and Flare. Embers carry over.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;            // smooth modern 2D: no pixel look
const FONT = "'Trebuchet MS', 'Segoe UI', Arial, sans-serif";
const TITLE = 'Last Lumen';
const CONTROLS = [
  'A / D или ← / → — бег',
  'Пробел / W / ↑ — прыжок (в воздухе ещё раз)',
  'Shift / K — рывок (неуязвим во время рывка)',
  'J / левая кнопка мыши — удар (серия из трёх)',
  'L / правая кнопка мыши — Вспышка, когда фонарь полон',
  'Esc / P — пауза · M — звук',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function hashRng(s) { // decoration only: a separate stream so scenery never shifts gameplay rolls
  let a = s | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const events = []; // window.game.events: anything the game wants a run to see
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dark = document.createElement('canvas'); dark.width = W; dark.height = H;
const dctx = dark.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k;
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textShadow(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 6;
  text(s, x, y, size, c, align, weight); ctx.restore();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(s, x, y, maxW, size, c, lineH) {
  ctx.font = `${size}px ${FONT}`;
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { text(line, x, yy, size, c); line = w; yy += lineH; }
    else line = t;
  }
  if (line) text(line, x, yy, size, c);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
canvas.addEventListener('pointerdown', e => {
  startAudio(); const c = 'Mouse' + e.button; down.add(c); hit.add(c);
});
addEventListener('pointerup', e => down.delete('Mouse' + e.button));
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => down.clear());
const K = {
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  jump: ['Space', 'KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  dash: ['ShiftLeft', 'ShiftRight', 'KeyK'], strike: ['KeyJ', 'Mouse0'], flare: ['KeyL', 'Mouse2'],
  ok: ['Enter', 'NumpadEnter'],
};
const held = a => a.some(c => down.has(c));
const tapped = a => a.some(c => hit.has(c));

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    } catch (e) { return; }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {

  jump: () => tone(380, 0.08, 'sine', 0.08, 1.6),

  flare: () => { tone(523, 0.5, 'sine', 0.22); tone(784, 0.6, 'sine', 0.16); tone(1046, 0.7, 'triangle', 0.1); },
  ember: (() => { let n = 0; return () => { n = (n + 1) % 5; tone(1100 + n * 90, 0.05, 'sine', 0.04); }; })(),
  kill: () => tone(240, 0.18, 'triangle', 0.14, 0.4),

  door: () => { tone(660, 0.18, 'sine', 0.16); setTimeout(() => tone(990, 0.3, 'sine', 0.14), 120); },
  pick: () => { tone(740, 0.12, 'triangle', 0.14); tone(1110, 0.2, 'sine', 0.1); },

// ---- Save: Embers and Shrine upgrades persist between runs -----------------------------------
const SAVE_KEY = 'last-lumen-save-v1';

}

const BOONS = [

];

const GROUND = 640;
const SAFE = { w: 1400, plats: [[640, 500, 200]], safe: true };
const ROOMS1 = [
  { w: 1600, plats: [[380, 500, 220], [760, 410, 240], [1180, 500, 200]] },

// Waves per combat room (1-7). Each room has two waves; one enemy may be swapped at random.
const WAVES = [
  null,
  [['crawler', 'crawler']],

  [['bloat', 'bloat', 'sentry', 'bat'], ['crawler', 'crawler', 'sentry', 'bat', 'bloat']],
  [['sentry', 'sentry', 'bloat', 'bat'], ['crawler', 'bloat', 'bat', 'bat', 'crawler', 'sentry']],
];
const FLOOR_NAME = ['', 'Затопленные Часы', 'Безмолвная Колокольня'];
const PAL = [null,
  { skyTop: '#0b2230', skyBot: '#06121c', far: '#123446', mid: '#0d2633', wall: '#14303c', wall2: '#0f2731',
    ground: '#1c2f36', groundTop: '#4f8f8a', plat: '#2b3f44', platTop: '#c9a45a', water: '#1d5560' },
  { skyTop: '#1a1434', skyBot: '#0a0818', far: '#2a2050', mid: '#1c1638', wall: '#231c3e', wall2: '#1a1530',
    ground: '#231e33', groundTop: '#8a6fb5', plat: '#332b48', platTop: '#d0a55a', water: '#3a2a66' },
];

// ---- Scenes ------------------------------------------------------------------------------------
let scene, state;
function makePlayer() {
  const maxHp = tune.player_hp + save.up.vigor * tune.up_vigor_hp;
  return { x: 140, y: GROUND, vx: 0, vy: 0, w: 26, h: 58, face: 1, onGround: true, airJumps: 0,
    coyote: 0, jumpBuf: 0, dropT: 0, dashT: 0, dashCd: 0, dashDir: 1, dashHit: null, inv: 0,
    atkT: 0, atkBuf: 0, combo: 0, comboT: 0, hitSet: null, hp: maxHp, maxHp,
    charge: Math.min(100, save.up.wick * 25), anim: 0, ghosts: [], flap: 0, hurtFlash: 0 };
}
function buildRun() {
  const pool1 = ROOMS1.slice(), pool2 = ROOMS2.slice();
  const pick = pool => pool.splice(Math.floor(rng() * pool.length), 1)[0];
  const rooms = [{ tmpl: SAFE, floor: 1, combat: 0 }];
  for (let i = 1; i <= 4; i++) rooms.push({ tmpl: pick(pool1), floor: 1, combat: i });
  for (let i = 5; i <= 7; i++) rooms.push({ tmpl: pick(pool2), floor: 2, combat: i });
  rooms.push({ tmpl: BOSS, floor: 2, combat: 8 });
  return rooms;
}
function reset() {
  const base = Number(params.get('seed')) || CONFIG.seed;
  const runSeed = base + save.runs * 101;
  seed = runSeed;
  const ash = save.ash;
  state = { t: 0, score: 0, gained: '', runSeed, ash,
    p: makePlayer(), rooms: buildRun(), roomI: 0, room: null, mode: 'open', modeT: 0,
    enemies: [], spawns: [], waves: [], shots: [], embers: [], parts: [], nums: [], fires: [], flares: [],
    boons: [], offer: [], sel: 1, rerolls: save.up.reroll, revive: save.up.second > 0,
    runEmbers: 0, kills: 0, cleared: 0, cam: 0, shake: 0, hitstop: 0, flash: 0, echoT: 0, fade: 1,
    deco: null, won: false, deadT: 0, hint: '' };
  enterRoom(0);
}
const ashM = k => 1 + state.ash * tune['ash_' + k];

function enterRoom(i) {
  state.roomI = i;
  const r = state.rooms[i];
  state.room = { ...r.tmpl, floor: r.floor, combat: r.combat };
  state.enemies = []; state.spawns = []; state.shots = []; state.fires = []; state.flares = [];
  const p = state.p; p.x = 140; p.y = GROUND; p.vx = 0; p.vy = 0;
  state.cam = 0; state.fade = 1;
  state.deco = makeDeco(i * 7 + 3, state.room.w);
  if (r.tmpl.safe) { state.mode = 'open'; }
  else {
    state.mode = 'intro'; state.modeT = 0.9;
    if (r.tmpl.boss) state.waves = [['warden']];
    else state.waves = WAVES[r.combat].map(w => w.slice());
    const unlocked = r.combat >= 5 ? ['crawler', 'bat', 'sentry', 'bloat'] : r.combat >= 3 ? ['crawler', 'bat', 'sentry'] : ['crawler'];
    if (!r.tmpl.boss && r.combat > 1) for (const w of state.waves) if (rng() < 0.4) {
      w[Math.floor(rng() * w.length)] = unlocked[Math.floor(rng() * unlocked.length)];
    }
  }
  events.push({ t: state.t, type: 'room', i });
}
function spawnWave(list) {
  const p = state.p, rw = state.room.w;
  for (const kind of list) {
    let x, tries = 0;
    do { x = 160 + rng() * (rw - 320); tries++; } while (Math.abs(x - p.x) < 320 && tries < 20);
    if (kind === 'warden') x = rw - 360;
    const fly = kind === 'bat' || kind === 'bloat';
    const y = fly ? 260 + rng() * 140 : GROUND;
    state.spawns.push({ kind, x, y, t: 0.75 });
  }
}
const EDEF = {
  crawler: { w: 58, h: 32, hp: 'crawler_hp', embers: 3, name: 'Ржавый Ползун' },
  bat: { w: 50, h: 30, hp: 'bat_hp', embers: 2, fly: true, name: 'Огарковая Мышь' },
  sentry: { w: 40, h: 76, hp: 'sentry_hp', embers: 4, name: 'Щитоносец-Пика' },
  bloat: { w: 56, h: 56, hp: 'bloat_hp', embers: 3, fly: true, name: 'Утопленный Пузырь' },
  warden: { w: 160, h: 190, hp: 'warden_hp', embers: 45, name: 'Колокольный Страж' },
};

  const d = EDEF[kind];

  return { kind, x, y, w: d.w, h: d.h, vx: 0, vy: 0, kb: 0, hp, maxHp: hp, face: -1, st: 'idle', t: 0.6 + rng() * 0.6,
    stun: 0, burn: 0, flash: 0, dead: false, dying: false, anim: rng() * 6, cd: 1 + rng() * 1.5,
    tx: 0, ty: 0, turnT: 0, phase: 1, summons: 0 };
}

// ---- Damage ---------------------------------------------------------------------------------------
function addNum(x, y, v, c) { state.nums.push({ x, y, v: Math.max(1, Math.round(v)), c, t: 0.8 }); }
function burst(x, y, n, c, sp = 260, life = 0.5, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2, s = sp * (0.3 + rng() * 0.7);
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: life * (0.6 + rng() * 0.4), life, c, size });
  }
}
function hurtEnemy(e, dmg, srcX, o = {}) {
  if (e.dead || e.dying) return 0;
  let d = dmg, blocked = false;
  if (e.kind === 'sentry' && !o.flare && !o.burnTick && e.stun <= 0 && Math.sign(srcX - e.x) === e.face) {
    d *= tune.sentry_block; blocked = true; sfx.clang();
    burst(e.x + e.face * 20, e.y - 40, 6, '#e8e0c0', 220, 0.25, 2);
  }
  e.hp -= d; e.flash = 0.1;
  if (!o.burnTick) {
    const kb = (o.kb ?? tune.knockback) * (e.kind === 'warden' ? 0.08 : blocked ? 0.4 : 1);
    e.kb = Math.sign(e.x - srcX || 1) * kb;
    addNum(e.x, e.y - e.h - 10, d, blocked ? '#9fb3b0' : o.flare ? '#ffe7a3' : '#ffffff');
  }
  if (o.burn) e.burn = Math.max(e.burn, o.burn);
  if (o.stun && !(e.kind === 'warden' && e.st === 'leap')) e.stun = Math.max(e.stun, o.stun * (e.kind === 'warden' ? 0.3 : 1));
  if (e.hp <= 0) killEnemy(e);
  return blocked ? 0.5 : 1;
}
function killEnemy(e) {
  if (e.kind === 'bloat') { e.dying = true; e.st = 'swell'; e.t = 0.35; e.hp = 0; return; }
  e.dead = true; state.kills++;
  sfx.kill();
  burst(e.x, e.y - e.h / 2, 16, e.kind === 'warden' ? '#ffd27a' : '#e0566b', 340, 0.6, 3);
  dropEmbers(e.x, e.y - e.h / 2, EDEF[e.kind].embers);
  if (e.kind === 'warden') { state.hitstop = 0.4; state.shake = 18; state.flash = 1; }

  ctx.fillStyle = 'rgba(5,8,14,0.7)'; rrect(W - 190, 18, 170, 36, 8); ctx.fill();
  drawEmber({ x: W - 166, y: 36, spin: 0 });
  textShadow(`${state.runEmbers}`, W - 140, 37, 20, '#ffe18a', 'left');
  textShadow(`банк ${save.embers}`, W - 30, 37, 14, '#bfae8c', 'right', '');
  // room
  const ci = state.roomI;
  const inFloor = state.rooms.filter(r => r.floor === room.floor);
  const idx = inFloor.indexOf(state.rooms[ci]) + 1;
  textShadow(`${FLOOR_NAME[room.floor]} · ${room.boss ? 'Страж' : `комната ${idx}/${inFloor.length}`}${state.ash ? ` · Пепел ${state.ash}` : ''}`, W / 2, 30, 18, '#d8e6e2');
  // boss bar
  const boss = state.enemies.find(e => e.kind === 'warden');
  if (boss) {
    ctx.fillStyle = 'rgba(5,8,14,0.75)'; rrect(W / 2 - 300, H - 52, 600, 26, 8); ctx.fill();
    ctx.fillStyle = boss.phase === 2 ? '#e0643a' : '#c94a7a'; rrect(W / 2 - 294, H - 46, 588 * clamp(boss.hp / boss.maxHp, 0, 1), 14, 5); ctx.fill();
    textShadow('Колокольный Страж', W / 2, H - 66, 18, '#ffd7c0');
  }
  // boons taken
  state.boons.forEach((id, i) => {
    const b = BOONS.find(x => x.id === id);
    const x = 30 + i * 40, y = boss ? H - 100 : H - 34;
    ctx.fillStyle = 'rgba(5,8,14,0.7)'; rrect(x - 16, y - 16, 32, 32, 7); ctx.fill();
    drawBoonIcon(b.kind, x, y, 0.85);
  });
  // dash ready marker
  if (p.dashCd > 0) { ctx.fillStyle = 'rgba(255,217,154,0.6)'; ctx.fillRect(26, 50, 120 * (1 - p.dashCd / (tune.dash_cooldown * (has('swift') ? 0.55 : 1))), 4); }
  // safe-room teaching, by doing
  if (room.safe) {
    const c = state.cam;
    const tips = [[240, 400, 'A / D — бег'], [560, 340, 'Пробел — прыжок, ещё раз в воздухе'], [900, 400, 'Shift — рывок: в рывке ты неуязвим'], [1160, 300, 'J — удар · L — Вспышка, когда фонарь полон']];
    for (const [x, y, s] of tips) textShadow(s, x - c, y, 18, '#f3e6c8');
    textShadow('Иди вправо, к двери →', 1150 - c, 230, 18, '#ffd99a');
  }
  if (state.mode === 'intro' && !room.safe) textShadow(room.boss ? 'Колокол просыпается...' : 'Двери запечатаны', W / 2, 140, 26, '#f0b0c8');
  if (state.mode === 'open' && !room.safe) textShadow('Путь открыт: иди к двери →', W / 2, 140, 22, '#ffd99a');
  if (state.room.combat === 1 && p.charge >= 100 && state.mode === 'fight') textShadow('Фонарь полон! Нажми L — Вспышка', W / 2, 180, 24, '#ffe29a');
  if (state.hintT > 0) textShadow(state.hint, W / 2, 210, 22, '#ffe7b8');
}
function drawBoonCards() {
  ctx.fillStyle = 'rgba(3,5,12,0.72)'; ctx.fillRect(0, 0, W, H);
  textShadow('Выбери дар', W / 2, 120, 36, '#ffe7b8');
  text('← / → и Enter, или 1 / 2 / 3', W / 2, 160, 18, '#c8bfa8');
  state.offer.forEach((b, i) => {
    const x = W / 2 - 390 + i * 270, y = 200, w = 240, h = 330, sel = i === state.sel;
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, sel ? '#3a2c1c' : '#1e1a1a'); g.addColorStop(1, '#100c10');
    ctx.fillStyle = g; rrect(x, y + (sel ? -8 : 0), w, h, 14); ctx.fill();
    ctx.strokeStyle = sel ? '#ffd07a' : '#6a5a40'; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
    const yy = y + (sel ? -8 : 0);
    const glow = ctx.createRadialGradient(x + w / 2, yy + 70, 0, x + w / 2, yy + 70, 60);
    glow.addColorStop(0, 'rgba(255,200,110,0.35)'); glow.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = glow; ctx.fillRect(x, yy + 10, w, 120);
    drawBoonIcon(b.kind, x + w / 2, yy + 70, 2);
    textShadow(b.name, x + w / 2, yy + 145, 21, '#ffe7b8');
    const kindName = { strike: 'Удар', lantern: 'Фонарь', flare: 'Вспышка', dash: 'Рывок', move: 'Движение', body: 'Тело' }[b.kind];
    text(kindName, x + w / 2, yy + 172, 15, '#c2a26a');
    wrapText(b.desc, x + w / 2, yy + 208, w - 36, 17, '#e8e0d0', 24);
    text(`${i + 1}`, x + w / 2, yy + h - 20, 18, '#8f8068');
  });
  if (state.rerolls > 0) text(`R — перебросить (${state.rerolls})`, W / 2, 575, 18, '#c8bfa8');
}
function drawPlayScene() {
  const ox = state.shake ? (rng() - 0.5) * state.shake : 0, oy = state.shake ? (rng() - 0.5) * state.shake : 0;
  drawBackground();
  ctx.save(); ctx.translate(-state.cam + ox, oy);
  drawGround();
  for (const f of state.fires) {
    const g = ctx.createLinearGradient(0, GROUND - 30, 0, GROUND); g.addColorStop(0, 'rgba(255,120,30,0)'); g.addColorStop(1, 'rgba(255,150,40,0.7)');
    ctx.fillStyle = g; ctx.fillRect(f.x - f.w / 2, GROUND - 30, f.w, 30);
  }
  for (const e of state.enemies) drawEnemy(e);
  for (const g of state.p.ghosts) drawPlayer({ ...state.p, x: g.x, y: g.y, face: g.face, atkT: 0 }, g.t * 2, true);
  const p = state.p;
  if (!(p.inv > 0 && p.dashT <= 0 && Math.floor(state.t * 20) % 2) || state.mode === 'dead') drawPlayer(p);
  if (p.hurtFlash > 0) { ctx.save(); ctx.globalAlpha = 0.3; ctx.fillStyle = '#ff5050'; ctx.fillRect(p.x - 20, p.y - 66, 40, 66); ctx.restore(); }
  ctx.restore();
  drawDarkness(ox, oy);
  // what glows reads through the dark: eyes, warnings, shots, embers, sparks, the Flare
  ctx.save(); ctx.translate(-state.cam + ox, oy);
  for (const e of state.enemies) drawEnemy(e, true);
  for (const s of state.spawns) drawSpawn(s);
  for (const s of state.shots) drawShot(s);
  for (const m of state.embers) drawEmber(m);
  for (const pt of state.parts) { ctx.globalAlpha = clamp(pt.t / pt.life, 0, 1); ctx.fillStyle = pt.c; ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size); }
  ctx.globalAlpha = 1;
  for (const f of state.flares) {
    const k = f.t / f.dur;
    ctx.strokeStyle = f.boom ? `rgba(230,110,210,${1 - k})` : `rgba(255,230,160,${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.2 + k * 0.9), 0, Math.PI * 2); ctx.stroke();
  }
  for (const n of state.nums) { ctx.globalAlpha = clamp(n.t * 2, 0, 1); textShadow(`${n.v}`, n.x, n.y, 18, n.c); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
  if (state.mode === 'boon') drawBoonCards();
  if (state.mode === 'dead') { ctx.fillStyle = `rgba(20,0,5,${0.5 * (1 - state.deadT / 1.6)})`; ctx.fillRect(0, 0, W, H); }
  if (state.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---- Title, Shrine, end screens -----------------------------------------------------------------
function drawMenuBackdrop(lightX, lightY, r) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b2230'); g.addColorStop(1, '#04080e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const t = clock.now();
  for (let i = 0; i < 7; i++) drawGear(120 + i * 190, 120 + (i % 3) * 140, 50 + (i % 4) * 22, 10 + i, t * 0.05 * (i % 2 ? 1 : -1), '#0e2a37');
  const lg = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, r);
  lg.addColorStop(0, 'rgba(255,190,90,0.35)'); lg.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#132029'; ctx.fillRect(0, 600, W, 120); ctx.fillStyle = '#4f8f8a'; ctx.fillRect(0, 600, W, 3);
}
const menuP = { x: 0, y: 0, face: 1, vx: 0, onGround: true, anim: 0, flap: 0, charge: 60, atkT: 0 };
function drawMenuKnight(x, y, s) {
  menuP.anim = clock.now(); menuP.x = 0; menuP.y = 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); drawPlayer(menuP); ctx.restore();
}
let shrineSel = 0, shrineMsg = '', shrineMsgT = 0;
const scenes = {
  figures: {
    update(dt) { if (!state) reset(); state.t += dt; },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#29505a'); g.addColorStop(1, '#16303a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1c2f36'; ctx.fillRect(0, 520, W, 200); ctx.fillStyle = '#4f8f8a'; ctx.fillRect(0, 520, W, 4);
      textShadow('Фигуры Last Lumen', W / 2, 50, 30, '#ffe7b8');
      const t = state ? state.t : 0;
      const kp = { ...makePlayer(), x: 130, y: 520, anim: t };
      ctx.save(); ctx.translate(130, 520); ctx.scale(1.6, 1.6); ctx.translate(-130, -520); drawPlayer(kp); ctx.restore();
      textShadow('Рыцарь-мотылёк (игрок)', 130, 560, 16, '#f3e6c8');
      const list = [['crawler', 330, 520], ['bat', 520, 400], ['sentry', 700, 520], ['bloat', 880, 420], ['warden', 1110, 520]];
      for (const [k, x, y] of list) {
        const e = { ...makeEnemy(k, x, y), face: -1, st: 'idle', anim: t, hp: 1, maxHp: 1 };
        ctx.save(); ctx.translate(x, y); ctx.scale(1.4, 1.4); ctx.translate(-x, -y); drawEnemy(e); drawEnemy(e, true); ctx.restore();
        textShadow(EDEF[k].name, x, 560 + (k === 'warden' ? 30 : 0), 16, '#f3e6c8');
      }
      drawEmber({ x: 330, y: 640, spin: t }); text('Уголь', 370, 640, 16, '#f3e6c8', 'left');
    },
  },
  title: {
    update() {
      if (tapped(K.ok) || pressed('Space')) { reset(); scene = 'play'; }
      if (pressed('KeyS')) { scene = 'shrine'; shrineSel = UPGRADES.length; }
    },
    draw() {
      drawMenuBackdrop(W / 2, 330, 420);
      drawMenuKnight(W / 2, 380, 2.4);
      ctx.save(); ctx.shadowColor = 'rgba(255,190,90,0.8)'; ctx.shadowBlur = 24;
      text(TITLE, W / 2, 90, 76, '#ffe7b8', 'center', 'bold'); ctx.restore();
      text('Последний свет затонувшего города', W / 2, 146, 22, '#c8d8d4');
      CONTROLS.forEach((c, i) => text(c, W / 2, 440 + i * 26, 17, '#d8d0bc'));
      textShadow('Enter — начать забег · S — Святилище', W / 2, 670, 24, '#ffd99a');
      if (save.embers || save.runs) text(`Углей в банке: ${save.embers} · забегов: ${save.runs} · побед: ${save.wins}`, W / 2, 700, 15, '#a89a80');
    },
  },
  play: {
    update(dt) {
      if (state.mode !== 'boon' && (pressed('KeyP') || pressed('Escape'))) { scene = 'pause'; return; }
      updatePlay(dt);
    },
    draw() { drawPlayScene(); },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyQ')) endRun(false);
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      textShadow('Пауза', W / 2, H / 2 - 40, 48, '#fff');
      text('Esc / P — продолжить · Q — сдаться (угли сохранятся)', W / 2, H / 2 + 20, 20, '#ddd');
      CONTROLS.forEach((c, i) => text(c, W / 2, H / 2 + 70 + i * 24, 16, '#bbb'));
    },
  },
  over: {
    update() { if (tapped(K.ok) || pressed('KeyR')) { scene = 'shrine'; shrineSel = UPGRADES.length; } },
    draw() { drawEnd(false); },
  },
  results: {
    update() { if (tapped(K.ok) || pressed('KeyR')) { scene = 'shrine'; shrineSel = UPGRADES.length; } },
    draw() { drawEnd(true); },
  },
  shrine: {
    update(dt) {
      shrineMsgT -= dt;
      const n = UPGRADES.length + 1;
      if (tapped(['KeyW', 'ArrowUp'])) shrineSel = (shrineSel + n - 1) % n;
      if (tapped(['KeyS', 'ArrowDown'])) shrineSel = (shrineSel + 1) % n;
      if (save.maxAsh > 0) {
        if (tapped(['KeyA', 'ArrowLeft'])) { save.ash = Math.max(0, save.ash - 1); writeSave(); }
        if (tapped(['KeyD', 'ArrowRight'])) { save.ash = Math.min(save.maxAsh, save.ash + 1); writeSave(); }
      }
      if (tapped(K.ok) || pressed('Space')) {
        if (shrineSel === UPGRADES.length) { reset(); scene = 'play'; return; }
        const u = UPGRADES[shrineSel];
        if (save.up[u.id] >= u.max) { shrineMsg = 'Уже на максимуме'; shrineMsgT = 1.5; }
        else if (save.embers < upCost(u)) { shrineMsg = 'Не хватает углей'; shrineMsgT = 1.5; sfx.fizzle(); }
        else { save.embers -= upCost(u); save.up[u.id]++; writeSave(); sfx.pick(); shrineMsg = `${u.name}: уровень ${save.up[u.id]}`; shrineMsgT = 1.5; }
      }
    },
    draw() {
      drawMenuBackdrop(250, 420, 360);
      // the shrine: a stone altar with a great lantern
      ctx.save(); ctx.translate(250, 600);
      ctx.fillStyle = '#2b3f44'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-90, 0); ctx.lineTo(-70, -80); ctx.lineTo(70, -80); ctx.lineTo(90, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c9a45a'; ctx.fillRect(-76, -86, 152, 8);
      ctx.restore();
      drawLanternIcon(250, 460, 3.2, 1, 0.6 + Math.sin(clock.now() * 3) * 0.1);
      drawMenuKnight(130, 600, 1.3);
      textShadow('Святилище', 760, 60, 40, '#ffe7b8');
      drawEmber({ x: 690, y: 104, spin: 0 }); textShadow(`Угли: ${save.embers}`, 712, 105, 22, '#ffe18a', 'left');
      UPGRADES.forEach((u, i) => {
        const y = 150 + i * 66, sel = i === shrineSel, lv = save.up[u.id], maxed = lv >= u.max;
        ctx.fillStyle = sel ? 'rgba(70,52,30,0.85)' : 'rgba(10,14,20,0.7)'; rrect(480, y, 580, 56, 10); ctx.fill();
        if (sel) { ctx.strokeStyle = '#ffd07a'; ctx.lineWidth = 2; ctx.stroke(); }
        text(u.name, 500, y + 18, 20, '#ffe7b8', 'left', 'bold');
        text(u.desc(), 500, y + 40, 15, '#d0c6b0', 'left');
        for (let k = 0; k < u.max; k++) { ctx.fillStyle = k < lv ? '#ffd36a' : '#3a3428'; ctx.beginPath(); ctx.moveTo(880 + k * 18, y + 12); ctx.lineTo(886 + k * 18, y + 18); ctx.lineTo(880 + k * 18, y + 24); ctx.lineTo(874 + k * 18, y + 18); ctx.fill(); }
        text(maxed ? 'макс.' : `${upCost(u)}`, 1040, y + 40, 17, maxed ? '#8f8068' : save.embers >= upCost(u) ? '#ffe18a' : '#9a7a6a', 'right');
      });
      const sy = 150 + UPGRADES.length * 66, sel = shrineSel === UPGRADES.length;
      ctx.fillStyle = sel ? 'rgba(110,70,30,0.9)' : 'rgba(10,14,20,0.7)'; rrect(480, sy, 580, 50, 10); ctx.fill();
      if (sel) { ctx.strokeStyle = '#ffd07a'; ctx.lineWidth = 3; ctx.stroke(); }
      textShadow('Начать забег', 770, sy + 25, 24, '#ffe7b8');
      if (save.maxAsh > 0) text(`Уровень Пепла: ${save.ash} из ${save.maxAsh} (← / →) — враги сильнее, углей больше`, 770, sy + 76, 17, '#e0a08a');
      else text('Победи Стража, чтобы открыть уровни Пепла', 770, sy + 76, 16, '#a89a80');
      text('↑ / ↓ — выбор · Enter — купить или начать', 770, 700, 16, '#a89a80');
      if (shrineMsgT > 0) textShadow(shrineMsg, 900, 105, 18, '#ffd99a');
    },
  },
};
function drawEnd(won) {
  scenes.play.draw();
  ctx.fillStyle = won ? 'rgba(20,14,4,0.75)' : 'rgba(14,2,6,0.78)'; ctx.fillRect(0, 0, W, H);
  textShadow(won ? 'Победа' : 'Свет погас', W / 2, 190, 60, won ? '#ffe29a' : '#f0a0b0');
  textShadow(state.gained, W / 2, 260, 28, '#ffe7b8');
  const rows = [
    `Комнат пройдено: ${state.cleared} из 8`,
    `Врагов повержено: ${state.kills}`,
    `Даров собрано: ${state.boons.length}`,
    won && state.bonus ? `Награда за Стража: ${state.bonus}` : `Лучший результат: ${save.bestRooms} комнат`,
    `Сид забега: ${state.runSeed}`,
  ];
  rows.forEach((r, i) => text(r, W / 2, 320 + i * 32, 20, '#d8d0bc'));
  if (won) text(`Открыт уровень Пепла ${save.maxAsh}: выбери его в Святилище`, W / 2, 500, 20, '#e0a08a');
  textShadow('Enter — в Святилище', W / 2, 580, 26, '#ffd99a');
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  if (muted) text('звук выкл. (M)', W - 20, H - 16, 14, '#9a9a9a', 'right');
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
