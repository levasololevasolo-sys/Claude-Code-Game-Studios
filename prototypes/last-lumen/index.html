function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

// Put a god's status on an enemy. Wrath of the Gods may chain a second god's status on top.

// Perun's discharge: the charged enemy is struck, and the lightning jumps on.
function discharge(e) {

  const dm = t => tune.shock_dmg * (has('duo_black') && t.curse > 0 ? 2 : 1);

    hurtEnemy(t, dm(t) * k, from.x, { kb: 80, status: true });

// After a cleared room: two or three doors, each showing what waits behind it.
function makeDoors() {

  room.inter = room.inter.filter(it => it.door !== 'fork' && it.door !== 'lair');
  if (k >= tune.rooms_per_loc) {
    room.inter.push({ x: room.w - 90, door: 'lair', label: `Логово: ${EDEF[LOCS[L].boss].name}`, act: () => enterRoom('boss', L) });
    return;

    else if (roll < 0.72 && !opts.some(o => o.type === 'rod')) opts.push({ type: 'rod' });
    else if (roll < 0.84 && !opts.some(o => o.type === 'res')) opts.push({ type: 'res' });
    else if (roll < 0.93 && !opts.some(o => o.type === 'heal')) opts.push({ type: 'heal' });
    else if (!opts.some(o => o.type === 'embers')) opts.push({ type: 'embers' });

// ---- Enemies ----------------------------------------------------------------------------------------
function updateEnemy(e, dt) {

  }

        if (e.t <= 0 || e.x < 40 || e.x > state.room.w - 40) { e.st = 'recover'; e.t = 0.7; }
      } else if (e.st === 'crouch') {
        e.vx = 0; if (e.t <= 0) { e.st = 'leap'; e.vy = -980; e.vx = clamp(dx * 1.6, -520, 520); e.t = 1.2; }
      } else if (e.st === 'leap') {
        if (e.y >= GROUND && e.vy >= 0 && e.t < 1.0) { e.st = 'recover'; e.t = 0.6; e.vx = 0; burst(e.x, GROUND, 8, '#5b6b6a', 160, 0.3, 3); }

  text('← / → и Enter, или 1 / 2 / 3 · руна в занятом слоте заменит старую', W / 2, 150, 17, '#c8bfa8');
  state.offer.forEach((b, i) => {
    const x = W / 2 - 390 + i * 270, y = 190, w = 240, h = 350, sel = i === state.sel;
    const yy = y + (sel ? -8 : 0);
    const duo = b.slot === 'duo', leg = b.slot === 'legend';
    const col = duo || leg ? '#ffd36a' : (GODS[b.god] || GODS.rod).color, [cr, cg, cb] = hexRgb(col);
    const g = ctx.createLinearGradient(0, yy, 0, yy + h); g.addColorStop(0, sel ? `rgba(${cr},${cg},${cb},0.28)` : '#1e1a1a'); g.addColorStop(1, '#100c10');
    ctx.fillStyle = g; rrect(x, yy, w, h, 14); ctx.fill();
    ctx.strokeStyle = sel ? col : `rgba(${cr},${cg},${cb},0.5)`; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
    if (duo || leg) { ctx.strokeStyle = 'rgba(255,211,106,0.5)'; ctx.lineWidth = 1; rrect(x + 6, yy + 6, w - 12, h - 12, 10); ctx.stroke(); }
    const glow = ctx.createRadialGradient(x + w / 2, yy + 70, 0, x + w / 2, yy + 70, 60);
    glow.addColorStop(0, `rgba(${cr},${cg},${cb},0.4)`); glow.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = glow; ctx.fillRect(x, yy + 10, w, 120);
    if (duo) { drawLanternIcon(x + w / 2 - 24, yy + 70, 1.1, 1, 0, GODS[b.gods[0]].sign); drawLanternIcon(x + w / 2 + 24, yy + 70, 1.1, 1, 0, GODS[b.gods[1]].sign); }
    else if (b.id === 'mend') drawBoonIcon('body', x + w / 2, yy + 70, 2);
    else drawLanternIcon(x + w / 2, yy + 70, 1.5, 1, 0, leg ? 'rod' : (GODS[b.god] || GODS.rod).sign);
    textShadow(b.name, x + w / 2, yy + 140, 21, '#ffe7b8');
    const sub = leg ? 'Легендарная руна' : duo ? `Союз: ${GODS[b.gods[0]].name} и ${GODS[b.gods[1]].name}` : b.slot ? `${SLOT_NAME[b.slot]} · ${(GODS[b.god] || GODS.rod).name}` : 'Тело';
    text(sub, x + w / 2, yy + 168, 15, col);
    wrapText(b.desc, x + w / 2, yy + 204, w - 36, 17, '#e8e0d0', 24);
    const had = b.slot && ['strike', 'dash', 'flare'].includes(b.slot) ? state.boons.map(runeOf).find(r => r.slot === b.slot) : null;
    if (had) text(`заменит: ${had.name}`, x + w / 2, yy + h - 46, 14, '#e0a08a');
    text(`${i + 1}`, x + w / 2, yy + h - 20, 18, '#8f8068');
  });
  if (state.rerolls > 0) text(`R — перебросить (${state.rerolls})`, W / 2, 590, 18, '#c8bfa8');
}
const MENU_TITLE = { shrine: 'Капище Рода', lantern: 'Ведунья Сова', weapon: 'Кузнец Потап', gate: 'Ворота в Навь' };
function drawMenu() {
  const m = state.menu, rows = menuRows(m.kind);
  ctx.fillStyle = 'rgba(3,4,10,0.7)'; ctx.fillRect(0, 0, W, H);
  const x0 = 300, w = 680, rh = m.kind === 'gate' ? 76 : 66, y0 = 140;
  ctx.fillStyle = 'rgba(16,12,12,0.92)'; rrect(x0 - 30, 60, w + 60, y0 + rows.length * rh - 20, 16); ctx.fill();
  ctx.strokeStyle = '#6a5a40'; ctx.lineWidth = 2; ctx.stroke();
  textShadow(MENU_TITLE[m.kind], W / 2, 96, 32, '#ffe7b8');
  rows.forEach((r, i) => {
    const y = y0 + i * rh, sel = i === m.sel;
    ctx.fillStyle = sel ? 'rgba(70,52,30,0.9)' : 'rgba(10,14,20,0.7)'; rrect(x0, y, w, rh - 10, 10); ctx.fill();
    if (sel) { ctx.strokeStyle = '#ffd07a'; ctx.lineWidth = 2; ctx.stroke(); }
    let tx = x0 + 20;
    if (r.icon) {
      if (r.icon.kind === 'lantern') drawLanternIcon(x0 + 34, y + (rh - 10) / 2, 0.75, 1, sel ? 0.4 : 0.15, r.icon.id, !save.lanterns[r.icon.id]);
      else drawWeaponIcon(r.icon.id, x0 + 34, y + (rh - 10) / 2, 0.9);
      tx = x0 + 70;
    }
    text(r.name, tx, y + 18, 20, '#ffe7b8', 'left', 'bold');
    ctx.save(); ctx.beginPath(); ctx.rect(tx, y, w - (tx - x0) - 12, rh); ctx.clip();
    text(r.desc, tx, y + 42, r.desc.length > 72 ? 13 : 14, '#d0c6b0', 'left'); ctx.restore();
    if (r.pips) for (let k = 0; k < r.pips[1]; k++) {
      ctx.fillStyle = k < r.pips[0] ? '#ffd36a' : '#3a3428';
      const px = x0 + w - 260 + k * 18;
      ctx.beginPath(); ctx.moveTo(px, y + 12); ctx.lineTo(px + 6, y + 18); ctx.lineTo(px, y + 24); ctx.lineTo(px - 6, y + 18); ctx.fill();
    }
    if (r.right) text(r.right, x0 + w - 16, y + 18, 16, r.ok ? '#a8e08a' : '#e08a7a', 'right');
  });
  const fy = y0 + rows.length * rh + 30;
  // what the player holds now
  let tx = W / 2 - 190;
  drawLoot({ x: tx, y: fy, spin: 0, type: 'ember' }); text(`${save.embers}`, tx + 14, fy + 1, 16, '#ffe18a', 'left'); tx += 70;
  for (const k of RES_KEYS) { drawResIcon(k, tx, fy, 0.8); text(`${save.res[k]}`, tx + 12, fy + 1, 16, RES[k].color, 'left'); tx += 70; }
  text('↑ / ↓ — выбор · E / Enter — взять · Esc — назад', W / 2, fy + 34, 16, '#a89a80');
  if (m.msgT > 0 && m.msg) textShadow(m.msg, W / 2, 128, 18, '#ffd99a');
}
function drawDialog() {
  const d = state.dialog;
  ctx.fillStyle = 'rgba(10,8,10,0.9)'; rrect(140, 170, W - 280, 160, 14); ctx.fill();
  ctx.strokeStyle = '#8a6a34'; ctx.lineWidth = 2; ctx.stroke();
  textShadow(d.name, 180, 198, 22, '#ffd99a', 'left');
  wrapText(d.lines[d.i] || '', W / 2, 240, W - 360, 19, '#efe6d2', 28);
  text(`${d.i + 1}/${d.lines.length} · E — дальше · Esc — закрыть`, W - 170, 314, 14, '#a89a80', 'right');
}
function drawPlayScene() {
  const ox = state.shake ? (hashRng(Math.floor(state.t * 60))() - 0.5) * state.shake : 0;
  const oy = state.shake ? (hashRng(Math.floor(state.t * 60) + 9)() - 0.5) * state.shake : 0;
  drawBackground();
  ctx.save();
  ctx.translate(-state.cam + ox, oy);
  drawGround();
  for (const f of state.fires) {
    const g = ctx.createLinearGradient(0, GROUND - 30, 0, GROUND); g.addColorStop(0, 'rgba(255,120,30,0)'); g.addColorStop(1, 'rgba(255,150,40,0.7)');
    ctx.fillStyle = g; ctx.fillRect(f.x - f.w / 2, GROUND - 30, f.w, 30);
  }
  for (const c of state.corpses) drawEnemy(c.e, false, c.t / 0.6);
  for (const e of state.enemies) drawEnemy(e);
  const p = state.p;
  for (const g of p.ghosts) { ctx.globalAlpha = clamp(g.t * 2, 0, 1); drawKnight({ ...p, x: g.x, y: g.y, face: g.face, atkT: 0 }, { ghost: 'rgba(255,210,140,0.35)', noCape: true }); }
  ctx.globalAlpha = 1;
  const blink = p.inv > 0 && p.dashT <= 0 && Math.floor(state.t * 20) % 2;
  if (!blink || state.mode === 'dead') drawKnight(p, { dead: state.mode === 'dead' ? 1 - state.deadT / 1.8 : 0 });
  drawTrail(p);
  if (p.hurtFlash > 0) { ctx.save(); ctx.globalAlpha = 0.3 * clamp(p.hurtFlash * 4, 0, 1); ctx.fillStyle = '#ff5050'; ctx.fillRect(p.x - 20, p.y - 66, 40, 66); ctx.restore(); }
  ctx.restore();
  drawDarkness(ox, oy);
  // what glows reads through the dark: eyes, warnings, shots, loot, sparks, the Flare
  ctx.save(); ctx.translate(-state.cam + ox, oy);
  for (const e of state.enemies) { drawEnemy(e, true); if (!e.dead && !e.dying) drawStatus(e); }
  for (const h of state.haz) drawHazard(h);
  for (const s of state.spawns) drawSpawn(s);
  for (const s of state.shots) drawShot(s);
  for (const w of state.wisps) drawWisp(w);
  for (const b of state.bolts) drawBolt(b);
  for (const m of state.loot) drawLoot(m);
  for (const pt of state.parts) { ctx.globalAlpha = clamp(pt.t / pt.life, 0, 1); ctx.fillStyle = pt.c; ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size); }
  ctx.globalAlpha = 1;
  for (const f of state.flares) {
    const k = f.t / f.dur;
    const [r, g, b] = f.boom ? [230, 110, 210] : f.quake ? [255, 200, 140] : hexRgb(f.c || '#ffe6a0');
    ctx.strokeStyle = `rgba(${r},${g},${b},${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath();
    if (f.quake) ctx.ellipse(f.x, f.y, f.r * (0.2 + k), 18 * (1 - k) + 4, 0, 0, Math.PI * 2);
    else ctx.arc(f.x, f.y, f.r * (0.2 + k * 0.9), 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const n of state.nums) { ctx.globalAlpha = clamp(n.t * 2, 0, 1); textShadow(`${n.v}`, n.x, n.y, 18, n.c); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawAmbient();
  drawHUD();
  if (state.mode === 'boon') drawBoonCards();
  if (state.menu) drawMenu();
  if (state.dialog) drawDialog();
  if (state.mode === 'dead') { ctx.fillStyle = `rgba(20,0,5,${0.5 * (1 - state.deadT / 1.8)})`; ctx.fillRect(0, 0, W, H); }
  if (state.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---- Title, figures, end screens -----------------------------------------------------------------
function drawMenuBackdrop(lightX, lightY, r) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1e140e'); g.addColorStop(1, '#06080e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const t = clock.now();
  for (let i = 0; i < 9; i++) drawPine(60 + i * 150 + (i % 2) * 40, 600, 300 + (i % 3) * 90, 120, i % 2 ? '#1a130e' : '#22180f');
  const lg = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, r);
  lg.addColorStop(0, 'rgba(255,190,90,0.35)'); lg.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1a130e'; ctx.fillRect(0, 600, W, 120); ctx.fillStyle = '#c08a4a'; ctx.fillRect(0, 600, W, 3);
}
function figKnight(x, y, s, t) {
  const kp = { ...makePlayer(), x: 0, y: 0, anim: t, face: 1 };
  kp.cape.forEach((c, i) => { c.x = c.ox = -6 - i * 5; c.y = c.oy = -44 + i * 6; });
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); drawKnight(kp); ctx.restore();
}
const scenes = {
  figures: {
    update(dt) { if (!state) reset(); state.t += dt; },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2c3c48'); g.addColorStop(1, '#141e26');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1c2a32'; ctx.fillRect(0, 330, W, 6); ctx.fillRect(0, 640, W, 80);
      ctx.fillStyle = '#4f8f8a'; ctx.fillRect(0, 330, W, 2); ctx.fillRect(0, 640, W, 3);
      textShadow('Фигуры Нави', W / 2, 34, 26, '#ffe7b8');
      const t = state.t;
      figKnight(80, 330, 1.3, t); textShadow('Рыцарь', 80, 352, 14, '#f3e6c8');
      const one = (k, x, y, s, label) => {
        const e = { ...makeEnemy(k, 0, 0), face: -1, st: 'idle', anim: t, hp: 1, maxHp: 1, born: 1 };
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s); drawEnemy(e); drawEnemy(e, true); ctx.restore();
        textShadow(label || EDEF[k].name, x, y + 22, 14, '#f3e6c8');
      };
      one('crawler', 210, 330, 1.2); one('bat', 350, 250, 1.2); one('sentry', 490, 330, 1.1); one('bloat', 640, 260, 1.1);
      one('ringer', 790, 330, 1.1); one('jelly', 940, 260, 1.1); one('dummy', 1080, 330, 1);
      one('clockmaker', 160, 640, 1, 'Кикимора (босс)'); one('warden', 440, 640, 0.95, 'Лихо (босс)'); one('queen', 760, 560, 0.85, 'Морена (босс)');
      ctx.save(); ctx.translate(-60, 0);
      drawIva(1040, 640, t); textShadow('Сова', 1040, 662, 14, '#f3e6c8');
      drawSmith(1150, 640, t); textShadow('Потап', 1150, 662, 14, '#f3e6c8');
      drawKeeper(1260, 640, t); textShadow('Доля', 1260, 662, 14, '#f3e6c8');
      ctx.restore();
      LANTERN_ORDER.forEach((id, i) => drawLanternIcon(1100 + i * 44, 120, 0.8, 1, 0.3, id));
      WEAPON_ORDER.forEach((id, i) => drawWeaponIcon(id, 1100 + i * 44, 190, 0.9));
    },
  },
  title: {
    update() { if (tapped(K.ok) || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      drawMenuBackdrop(W / 2, 300, 440);
      figKnight(W / 2, 395, 1.6, clock.now());
      ctx.save(); ctx.shadowColor = 'rgba(255,190,90,0.8)'; ctx.shadowBlur = 24;
      text(TITLE, W / 2, 70, 72, '#ffe7b8', 'center', 'bold'); ctx.restore();
      STORY_INTRO.forEach((l, i) => text(l, W / 2, 124 + i * 24, 17, '#d8cdb4'));
      CONTROLS.forEach((c, i) => text(c, W / 2, 425 + i * 23, 16, '#c8bfa8'));
      textShadow('Enter — на заставу', W / 2, 672, 24, '#ffd99a');
      if (save.runs) text(`Углей: ${save.embers} · забегов: ${save.runs} · чудищ повержено: ${Object.values(save.bosses).reduce((a, b) => a + b, 0)} · побед: ${save.wins}`, W / 2, 704, 15, '#a89a80');
    },
  },
  play: {
    update(dt) {
      if (!state.menu && !state.dialog && state.mode !== 'boon' && (pressed('KeyP') || pressed('Escape'))) { scene = 'pause'; return; }
      updatePlay(dt);
    },
    draw() { drawPlayScene(); },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyQ') && state.world === 'run') endRun(false);
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      textShadow('Пауза', W / 2, H / 2 - 120, 48, '#fff');
      text(state.world === 'run' ? 'Esc / P — продолжить · Q — сдаться (добыча сохранится)' : 'Esc / P — продолжить', W / 2, H / 2 - 60, 20, '#ddd');
      CONTROLS.forEach((c, i) => text(c, W / 2, H / 2 - 10 + i * 24, 16, '#bbb'));
    },
  },
  over: { update() { if (tapped(K.ok)) { reset(); scene = 'play'; } }, draw() { drawEnd(false); } },
  results: { update() { if (tapped(K.ok)) { reset(); scene = 'play'; } }, draw() { drawEnd(true); } },
};
function drawEnd(good) {
  scenes.play.draw();
  ctx.fillStyle = good ? 'rgba(20,14,4,0.78)' : 'rgba(14,2,6,0.8)'; ctx.fillRect(0, 0, W, H);
  textShadow(state.won ? 'Победа' : state.home ? 'Домой, на заставу' : 'Ты пал', W / 2, 170, 60, good ? '#ffe29a' : '#f0a0b0');
  const gp = state.gained.split(' · ');
  textShadow(gp[0], W / 2, 236, 24, '#ffe7b8');
  if (gp[1]) text('Добыча: ' + gp.slice(1).join(' · '), W / 2, 268, 18, '#e0d0a8');
  const route = state.run ? state.run.route.map(r => LOCS[r].name).join(' → ') : '';
  const rows = [
    `Путь: ${route}`,
    `Чудищ повержено: ${state.bosses} из 3`,
    `Комнат пройдено: ${state.cleared}`,
    `Врагов повержено: ${state.kills}`,
    `Рун собрано: ${state.boons.length}`,
    `Сид забега: ${state.runSeed}`,
  ];
  rows.forEach((r, i) => text(r, W / 2, 310 + i * 30, 20, '#d8d0bc'));
  if (state.won) text(`Открыт уровень Пепла ${save.maxAsh}: выбери его у Ворот`, W / 2, 510, 20, '#e0a08a');
  else text('Пряха снова вытянет твою нить. Потрать добычу у жителей.', W / 2, 510, 18, '#c8bfa8');
  textShadow('Enter — на заставу', W / 2, 590, 26, '#ffd99a');
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  if (muted) text('звук выкл. (M)', W - 20, H - 16, 14, '#9a9a9a', 'right');
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
