# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: dash_cooldown
    status: active
    source: design/gdd/movement-and-combat.md
    referenced_by:
      - design/gdd/armor-and-hero-progression.md
      - design/gdd/buffs-and-debuffs.md
      - design/gdd/gods-and-runes.md
    variables:
      - dash_cooldown
      - k_swift
      - k_vihr
      - cd_legs
      - k_vow_perun
      - cd_t2a
      - dash_dur
      - dash_cd_floor
      - dash_gap
    output_range: [0.37, 1.2]
    expression: "max(dash_cd_floor, dash_dur + dash_gap, dash_cooldown · k_swift · k_vihr · (1 − cd_legs) · k_vow_perun · (1 − cd_t2a))"
    notes: "dash_floor = max(0.25, длина рывка + 0.2): 0.37 с в воздухе, 0.5 с перекатом. cd_legs (0–0.10) входит один раз. Пого — исключение 0.05 с"
    added: 2026-11-27
    revised: ""

  - name: enemy_hp
    status: active
    source: design/gdd/enemies-and-elites.md
    referenced_by:
      - design/gdd/economy-and-meta.md
    variables:
      - base_hp
      - ash
      - ash_hp
      - tier
      - tier_hp
      - boss_tier_hp
      - elite_hp
    output_range: [20, 3000]
    expression: "base_hp · (1 + ash · ash_hp) · (1 + (tier − 1) · T) · (elite ? elite_hp : 1)"
    added: 2026-11-27
    revised: ""

